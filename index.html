<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pediatria Chic | Gestão Financeira Pediátrica</title>
  <meta name="description" content="Controle financeiro para médicas pediatras - Salário fixo, plantões D+90 e despesas" />
  <meta name="theme-color" content="#EC407A" />

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pediatria Chic" />
  <meta name="application-name" content="Pediatria Chic" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Favicons and App Icons -->
  <link rel="icon" type="image/png" href="./assets/icons/favicon.png" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" />

  <!-- Typography & Icons with display=block to prevent ligature text FOUT blowout -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=Manrope:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary-pink": "#F48FB1",
            "primary-pink-dark": "#EC407A",
            "lilac-light": "#F3E5F5",
            "lilac-medium": "#CE93D8",
            "lilac-dark": "#AB47BC",
            "mint-income": "#26A69A",
            "mint-income-bg": "#E0F2F1",
            "coral-expense": "#FF7043",
            "coral-expense-bg": "#FBE9E7",
            "bg-app": "#FBF8FD",
            "card-bg": "#FFFFFF",
            "text-main": "#2D3142",
            "text-muted": "#7A7E91",

            // Stitch compatibility
            "surface": "#faf8ff",
            "surface-bright": "#faf8ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f3f2ff",
            "surface-container": "#ebedff",
            "surface-container-high": "#e4e7fe",
            "surface-container-highest": "#dee1f8",
            "on-surface": "#171b2b",
            "on-surface-variant": "#4d444d",
            "primary": "#7e4a8a",
            "primary-container": "#ce93d8",
            "primary-fixed": "#fdd6ff",
            "primary-fixed-dim": "#efb1f9",
            "on-primary-fixed": "#340141",
            "on-primary-fixed-variant": "#643370",
            "secondary": "#b80f55",
            "secondary-container": "#fd4e87",
            "secondary-fixed": "#ffd9df",
            "secondary-fixed-dim": "#ffb1c2",
            "on-secondary-fixed": "#3f0018",
            "on-secondary-fixed-variant": "#8f003f",
            "tertiary": "#006a62",
            "tertiary-container": "#41b9ad",
            "tertiary-fixed": "#84f5e8",
            "on-tertiary-fixed": "#00201d",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a",
            "outline": "#7f747e",
            "outline-variant": "#d0c2ce"
          },
          borderRadius: {
            "card": "24px",
            "pill": "50px",
            "lg": "2rem",
            "xl": "3rem"
          },
          fontFamily: {
            "display": ["Bricolage Grotesque", "sans-serif"],
            "headline": ["Bricolage Grotesque", "sans-serif"],
            "body": ["Manrope", "sans-serif"]
          }
        }
      }
    };
  </script>

  <!-- Custom Styles with Robust Material Symbols Outlined Protection -->
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-fixed">

  <div class="app-wrapper">
    <!-- Mobile-First iPhone 16 Plus Canvas (430px target) -->
    <div class="device-frame flex flex-col min-h-screen relative">

      <!-- Top Glassmorphism App Header (Stitch Aligned) -->
      <header class="sticky top-0 w-full z-40 pt-safe glass-header px-4 py-2 flex flex-col gap-2">
        <div class="h-12 flex items-center justify-between">
          <!-- Logo & Brand & Active Tab Indicator -->
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-secondary to-primary flex items-center justify-center text-white shadow-sm overflow-hidden flex-shrink-0">
              <img
                src="./assets/icons/icon-192.png"
                alt="Pediatria Chic Logo"
                class="w-full h-full object-cover"
                onerror="this.style.display='none'; if (this.nextElementSibling) { this.nextElementSibling.classList.remove('hidden'); this.nextElementSibling.style.display='inline-flex'; }"
              />
              <span class="material-symbols-outlined text-[18px] hidden" data-icon="favorite">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              </span>
            </div>
            <div class="flex flex-col leading-tight">
              <div class="flex items-center gap-1.5">
                <span class="font-headline text-[15px] font-bold text-on-surface">Pediatria Chic</span>
                <span class="text-on-surface-variant/40">•</span>
                <span id="header-active-tab" class="font-headline text-[14px] font-bold text-secondary">Início</span>
              </div>
              <span id="header-doctor-title" class="text-[10px] text-primary font-bold tracking-wider uppercase">Dra. Pediatra</span>
            </div>
          </div>

          <!-- Controls: Notifications, Install, Profile, Desktop Toggle -->
          <div class="flex items-center gap-1">
            <!-- Install PWA App Button -->
            <button
              type="button"
              id="btn-install-app"
              class="w-9 h-9 rounded-full bg-secondary-fixed text-secondary hover:bg-secondary-fixed/80 flex items-center justify-center shadow-sm transition-all active:scale-95"
              title="Instalar no celular (PWA)"
              aria-label="Instalar aplicativo"
            >
              <span class="material-symbols-outlined text-[18px]" data-icon="smartphone">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
              </span>
            </button>

            <!-- Notifications with dynamic counter badge -->
            <button
              type="button"
              id="btn-notifications"
              class="relative w-9 h-9 rounded-full bg-white text-on-surface-variant hover:text-primary flex items-center justify-center shadow-sm transition-all active:scale-95"
              aria-label="Notificações e Avisos"
              title="Avisos e Repasses"
            >
              <span class="material-symbols-outlined text-[20px]" data-icon="notifications">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
              </span>
              <span id="notif-badge" class="notif-badge-dot hidden">0</span>
            </button>

            <!-- Privacy Mode Toggle (Nubank / Mobills Inspired) -->
            <button
              type="button"
              id="btn-toggle-privacy"
              class="w-9 h-9 rounded-full bg-white text-on-surface-variant hover:text-primary flex items-center justify-center shadow-sm transition-all active:scale-95"
              title="Modo Sigilo (Ocultar Valores)"
              aria-label="Alternar visibilidade de valores"
            >
              <span class="material-symbols-outlined text-[18px]" data-icon="visibility">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
              </span>
            </button>

            <!-- Desktop Preview Frame Toggle -->
            <button
              type="button"
              id="btn-toggle-frame"
              class="w-9 h-9 rounded-full bg-white text-on-surface-variant hover:text-primary flex items-center justify-center shadow-sm transition-all active:scale-95"
              title="Expandir tela"
            >
              <span class="material-symbols-outlined text-[18px]" data-icon="desktop_windows">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7v2H8v2h8v-2h-2v-2h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z"/></svg>
              </span>
            </button>

            <!-- Doctor Profile Avatar (Click opens Profile & Goals Dialog) -->
            <button
              type="button"
              id="btn-profile"
              class="relative w-9 h-9 rounded-full bg-secondary-fixed flex items-center justify-center text-secondary font-bold text-[11px] shadow-sm overflow-hidden border border-white active:scale-95 transition-transform"
              title="Perfil & Metas da Médica"
              aria-label="Perfil da Médica"
            >
              <img
                src="./assets/icons/icon-192.png"
                alt="Perfil Pediatra"
                class="w-full h-full object-cover"
                onerror="this.style.display='none'; if (this.nextElementSibling) { this.nextElementSibling.classList.remove('hidden'); this.nextElementSibling.style.display='block'; }"
              />
              <span id="header-avatar-initials" class="hidden font-bold">DR</span>
            </button>
          </div>
        </div>

        <!-- Month / Year Selector Bar with Quick Picker Trigger -->
        <div class="flex items-center justify-between bg-white rounded-full p-1 shadow-[0_4px_16px_rgba(126,74,138,0.06)] border border-purple-50">
          <button
            type="button"
            id="btn-prev-month"
            class="w-8 h-8 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container transition-colors active:scale-90"
            aria-label="Mês anterior"
          >
            <span class="material-symbols-outlined text-[18px]" data-icon="chevron_left">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </span>
          </button>

          <button
            type="button"
            id="btn-open-month-picker"
            class="flex items-center gap-1.5 px-3 py-1 bg-primary-fixed/60 text-on-primary-fixed rounded-full shadow-sm hover:bg-primary-fixed transition-all active:scale-95 cursor-pointer"
            title="Clique para escolher qualquer mês"
          >
            <span class="material-symbols-outlined text-[15px] text-primary" data-icon="calendar_today">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/></svg>
            </span>
            <span id="current-month-display" class="text-[13px] font-bold text-primary">Setembro 2026</span>
            <span class="material-symbols-outlined text-[16px] text-primary" data-icon="expand_more">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
            </span>
          </button>

          <button
            type="button"
            id="btn-next-month"
            class="w-8 h-8 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container transition-colors active:scale-90"
            aria-label="Próximo mês"
          >
            <span class="material-symbols-outlined text-[18px]" data-icon="chevron_right">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </span>
          </button>
        </div>
      </header>

      <!-- Main Dynamic View Container -->
      <main id="main-content" class="flex-1 w-full px-4 pt-2 pb-24">
        <!-- Dynamic views rendered seamlessly by js/bundle.js -->
        <div class="flex flex-col gap-4 animate-pulse pt-4">
          <div class="h-10 bg-surface-container rounded-2xl w-2/3"></div>
          <div class="h-44 bg-surface-container rounded-[24px]"></div>
          <div class="h-28 bg-surface-container rounded-2xl"></div>
        </div>
      </main>

      <!-- Bottom Glassmorphic Navigation Bar with Central Floating Action Button (FAB) -->
      <div class="fixed bottom-0 inset-x-0 z-50 pointer-events-none pb-safe flex justify-center">
        <nav class="pointer-events-auto mx-auto mb-2 max-w-[400px] w-[calc(100%-2rem)] h-16 glass-nav rounded-full px-3 flex items-center justify-between shadow-[0_12px_32px_rgba(171,71,188,0.14)]">
          <!-- Tab 1: Início -->
          <button
            type="button"
            class="nav-tab flex flex-col items-center justify-center min-w-[44px] min-h-[44px] text-secondary font-bold transition-all"
            data-tab="inicio"
          >
            <span class="material-symbols-outlined text-[22px]" data-icon="vital_signs" style="font-variation-settings: 'FILL' 1;">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M10.5 15H8l-1.5 4.5L4 12H1v-2h4l1.5 4.5L8 5h2.5l2 6.5 1.5-3 2 4.5H23v2h-7l-1.5-3.5-2 4z"/></svg>
            </span>
            <span class="text-[10px] mt-0.5">Início</span>
          </button>

          <!-- Tab 2: Plantões -->
          <button
            type="button"
            class="nav-tab flex flex-col items-center justify-center min-w-[44px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-all"
            data-tab="plantoes"
          >
            <span class="material-symbols-outlined text-[22px]" data-icon="calendar_month">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/></svg>
            </span>
            <span class="text-[10px] mt-0.5">Plantões</span>
          </button>

          <!-- Center FAB: Add (+) with glowing gradient -->
          <button
            type="button"
            id="fab-add"
            class="fab-btn flex items-center justify-center w-12 h-12 -mt-5 rounded-full text-white cursor-pointer"
            aria-label="Novo Registro"
          >
            <span class="material-symbols-outlined text-[26px]" data-icon="add">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </span>
          </button>

          <!-- Tab 3: Despesas -->
          <button
            type="button"
            class="nav-tab flex flex-col items-center justify-center min-w-[44px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-all"
            data-tab="despesas"
          >
            <span class="material-symbols-outlined text-[22px]" data-icon="account_balance_wallet">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            </span>
            <span class="text-[10px] mt-0.5">Despesas</span>
          </button>

          <!-- Tab 4: Relatórios -->
          <button
            type="button"
            class="nav-tab flex flex-col items-center justify-center min-w-[44px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-all"
            data-tab="relatorios"
          >
            <span class="material-symbols-outlined text-[22px]" data-icon="insights">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M21 18.25l-5.75-5.75-3.5 3.5L3.5 7.75l1.41-1.41 6.84 6.84 3.5-3.5 7.16 7.16-1.41 1.41zM16 6h5v5h-2V9.41l-3.5 3.5-1.41-1.41L17.59 8H16V6z"/></svg>
            </span>
            <span class="text-[10px] mt-0.5">Relatórios</span>
          </button>
        </nav>
      </div>

      <!-- Backdrop Overlay for Modal -->
      <div id="modal-overlay" class="modal-overlay"></div>

      <!-- Bottom Sheet Modal Shell -->
      <aside id="bottom-sheet" class="bottom-sheet" aria-modal="true" role="dialog" aria-label="Novo Registro"></aside>

      <!-- Dialog Modal Overlay & Container for Submenus, Vouchers, Confirmations, Notifications -->
      <div id="dialog-overlay" class="dialog-overlay"></div>
      <div id="dialog-container" class="dialog-box" role="dialog" aria-modal="true"></div>

      <!-- Toast Notification -->
      <div id="toast" class="toast-container">
        <span class="material-symbols-outlined text-secondary text-[20px]" data-icon="favorite">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </span>
        <span id="toast-message">Plantão salvo com sucesso! 🌸</span>
      </div>

    </div>
  </div>

  <!-- JavaScript Application Bundle (Self-contained, zero-CORS file:// compatible & offline-ready) -->
  <script src="js/bundle.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Pediatria Chic Service Worker registrado:', reg.scope))
          .catch((err) => console.warn('Falha no registro do Service Worker:', err));
      });
    }
  </script>
</body>
</html>
