<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <title>Finanças Pediatria v4.0 - Dra. Fernanda Ch.</title>
  <meta name="description" content="Controle financeiro pediátrico com regras D+60 (75%) e D+90 (25%), macro-grupos de despesas e interface Silk & Rose Gold." />
  
  <!-- Apple iOS WebApp Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finanças Ped v4" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#E8A598" />

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./assets/icons/favicon.png" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />

  <!-- Tipografia Editorial Silk & Rose Gold -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos da Versão 4.0 -->
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app-container">
    <!-- Estado de Carregamento Suave Silk & Rose Gold -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; gap: 14px; color: #E8A598;">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      <p style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.92rem; font-weight: 700; color: #7E7485;">
        Carregando Finanças Pediatria v4.0...
      </p>
    </div>
  </div>

  <noscript>
    <div style="padding: 20px; text-align: center; color: #D81B60; font-family: sans-serif;">
      Para utilizar o Finanças Pediatria v4.0, por favor ative o JavaScript no seu navegador.
    </div>
  </noscript>

  <!-- Execução Autônoma Sem Dependência de Módulos (Zero CORS) -->
  <script src="./js/bundle.js"></script>

  <!-- Registro do Service Worker v4 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('SW Finanças v4.0 registrado com sucesso.'))
          .catch((err) => console.warn('Falha ao registrar SW v4:', err));
      });
    }
  </script>
</body>
</html>
